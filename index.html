<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numerologia da Roupa de Ano Novo</title>
  <link rel="stylesheet" href="style/index.css">
</head>
<body>
  <main class="caixa">
    <h1>Cor da Roupa de Ano Novo</h1>
    <p>Informe o dia e o mês do seu nascimento.</p>

    <form id="formulario">
      <label for="dia">Dia</label>
      <input type="number" id="dia" min="1" max="31" required>

      <label for="mes">Mês</label>
      <input type="number" id="mes" min="1" max="12" required>

      <button type="submit">Calcular</button>
    </form>

    <div id="resultado"></div>
  </main>
  <script src="index.js"></script>

</body>
</html>
